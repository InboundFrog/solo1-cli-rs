[package]
name = "solo-cli"
version = "0.2.1"
description = "CLI tool for interacting with SoloKeys hardware security keys"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "solo_cli"
path = "src/lib.rs"

[[bin]]
name = "solo"
path = "src/main.rs"

[dependencies]
solo-ctap2.workspace = true
solo-ctaphid.workspace = true
solo1.workspace = true

base64.workspace = true
ciborium.workspace = true
clap.workspace = true
ctrlc.workspace = true
hex.workspace = true
hmac.workspace = true
indicatif.workspace = true
log.workspace = true
p256.workspace = true
rand.workspace = true
reqwest.workspace = true
rpassword.workspace = true
rusb.workspace = true
serde.workspace = true
serde_json.workspace = true
serialport.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
solo-ctaphid = { workspace = true, features = ["test-util"] }
rcgen.workspace = true
tempfile.workspace = true
time.workspace = true

[lints]
workspace = true
