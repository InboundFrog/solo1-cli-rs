# CI via the reusable workflows in InboundFrog/repo-tools:
# https://github.com/InboundFrog/repo-tools (its README lists every input).
# The `uses:` lines pin a release by commit SHA, with the tag in a comment, so
# Dependabot proposes each newer release. Keep the final "CI OK" job: it is the
# one check branch protection requires.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: InboundFrog/repo-tools/.github/workflows/rust.yml@11670fe8f6e9cddf7be79989e2da4ae48f399584 # v0.1.1
    with:
      working-directory: .
      toolchain: "1.99"
      # hidapi / libudev-sys link against these.
      apt-packages: libudev-dev libusb-1.0-0-dev pkg-config

  # Cases the unit tests cannot show on a normal single-user run: root, and a
  # second user who must not read the key.
  key-file-users:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libudev-dev libusb-1.0-0-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: "1.99"
          cache: false
      - name: Build
        run: |
          cargo test -p solo-cli --locked --no-run
          cargo build -p solo-cli --locked
      - name: write_private_key tests as root
        # Already built above, so root writes nothing into target/.
        run: sudo env "PATH=$PATH" "HOME=$HOME" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" cargo test -p solo-cli --locked write_private_key
      - name: Another user cannot read a key from genkey
        run: |
          sudo useradd -M solo_other
          dir=$(mktemp -d)
          chmod 755 "$dir"
          target/debug/solo genkey -o "$dir/key.pem"
          test "$(stat -c %a "$dir/key.pem")" = 600
          if sudo -u solo_other cat "$dir/key.pem"; then
            echo "another user could read the key" >&2
            exit 1
          fi

  ci-ok:
    name: CI OK
    if: always()
    needs: [rust, key-file-users]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
