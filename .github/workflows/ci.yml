# CI via the reusable workflows in InboundFrog/repo-tools:
# https://github.com/InboundFrog/repo-tools (its README lists every input).
# The `uses:` lines pin a release by commit SHA, with the tag in a comment, so
# Dependabot proposes each newer release. Keep the final "CI OK" job: it is the
# one check branch protection requires.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: InboundFrog/repo-tools/.github/workflows/rust.yml@11670fe8f6e9cddf7be79989e2da4ae48f399584 # v0.1.1
    with:
      working-directory: .
      toolchain: "1.100"
      # hidapi / libudev-sys link against these.
      apt-packages: libudev-dev libusb-1.0-0-dev pkg-config

  # The same checks on macOS. The reusable workflow takes a `runs-on` input,
  # installs apt packages on Linux only (hidapi needs none on macOS), and its
  # rt-run step shell is written for bash 3.2 and BSD tools. audit and MSRV are
  # skipped: they already run in `rust`, and audit always runs on Linux.
  rust-macos:
    uses: InboundFrog/repo-tools/.github/workflows/rust.yml@11670fe8f6e9cddf7be79989e2da4ae48f399584 # v0.1.1
    with:
      working-directory: .
      toolchain: "1.100"
      runs-on: macos-latest
      audit-command: skip
      msrv-command: skip

  # Compile and lint only, so the non-Unix code (for example the plain-write
  # version of write_private_key) is built at least once. Nothing is run:
  # nobody can test Windows. Not in `needs` of CI OK, so a Windows failure
  # does not block a merge. fmt, tests, audit and MSRV run in `rust`.
  rust-windows:
    name: Windows build (not tested)
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: "1.100"
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --all-targets --locked

  ci-ok:
    name: CI OK
    if: always()
    needs: [rust, rust-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
