# Dependabot version updates, from the repo-tools sample:
# https://github.com/InboundFrog/repo-tools/blob/main/examples/dependabot.yml
#
# github-actions covers the repo-tools pins in .github/workflows/ci.yml too, so
# a new release arrives as a PR here after the cooldown. Minor and patch
# updates share one PR per ecosystem; majors get their own.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ['/']
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directories: ['/']
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # p256 0.13 / elliptic-curve 0.13 are still on rand_core 0.6. rand 0.9 brings
    # rand_core 0.9 and breaks p256's CryptoRng / RngCore trait bounds. Stay on
    # rand 0.8.x (patch-only) until the RustCrypto stack moves to rand_core 0.9
    # (p256 0.14+).
    ignore:
      - dependency-name: rand
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
