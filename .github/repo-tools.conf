# Settings for the generated CI and dependabot.yml. Every key:
# https://github.com/InboundFrog/repo-tools/blob/main/examples/repo-tools.conf

# hidapi / libudev-sys link against these.
APT_PACKAGES=libudev-dev libusb-1.0-0-dev pkg-config

RUST_VERSION=1.96

# p256 0.13 / elliptic-curve 0.13 are still on rand_core 0.6. rand 0.9 brings
# rand_core 0.9 and breaks p256's CryptoRng / RngCore trait bounds. Stay on
# rand 0.8.x (patch-only) until the RustCrypto stack moves to rand_core 0.9
# (p256 0.14+).
DEPENDABOT_IGNORE_CARGO=rand:major+minor
