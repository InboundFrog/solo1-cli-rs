[package]
name = "solo1"
version = "0.2.1"
edition = "2021"
description = "CLI tool for interacting with SoloKeys Solo 1 hardware security keys"
license = "MIT"

[lib]
name = "solo1"
path = "src/lib.rs"

[[bin]]
name = "solo1"
path = "src/main.rs"

[dependencies]
aes = "0.9"
base64 = "0.23"
cbc = { version = "0.2", features = ["alloc"] }
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
digest = "0.11"
hex = "0.4"
hidapi = "2"
hmac = "0.13"
ihex = "3"
indicatif = "0.18"
p256 = { version = "0.14", features = ["ecdsa", "pem", "pkcs8", "ecdh"] }
rand = "0.10.2"
reqwest = { version = "0.13", features = ["blocking", "json"] }
rpassword = "7"
rusb = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
sha2 = "0.11"
thiserror = "2"
x509-cert = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
time = "0.3"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Deny panics
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"